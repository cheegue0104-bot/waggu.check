<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 관상 궁합 분석기</title>
    <!-- 폰트: 전통적인 느낌을 강조하기 위해 Noto Serif KR을 기본으로 사용 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif KR"', 'serif'],
                    },
                    colors: {
                        hanji: {
                            DEFAULT: '#f4eadd', // 한지 기본색
                            light: '#fdfbf7',   // 밝은 한지
                            dark: '#e6d5c3'     // 어두운 한지
                        },
                        wood: {
                            DEFAULT: '#4a3728', // 나무 기둥 색
                            dark: '#2d1e12',
                            light: '#6d4f3b'
                        },
                        ink: {
                            DEFAULT: '#1c1917', // 먹물 색
                            light: '#44403c'
                        },
                        stamp: {
                            DEFAULT: '#991b1b', // 인주(도장) 색
                            light: '#b91c1c'
                        },
                        gold: '#b48e4b', // 차분한 전통 금색
                    }
                }
            }
        }
    </script>
    <style>
        body {
            /* 한지 텍스처 느낌의 배경 (SVG 노이즈 필터 활용) */
            background-color: #f4eadd;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            color: #1c1917;
            font-family: '"Noto Serif KR"', serif;
        }
        
        /* 전통 창살/액자 느낌의 테두리 */
        .trad-border {
            border: 4px solid #4a3728;
            padding: 4px;
            position: relative;
        }
        .trad-border::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid #4a3728;
            pointer-events: none;
        }

        /* 사진 업로드 영역 스타일 */
        .photo-upload {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .photo-upload:hover {
            border-color: #991b1b;
            background-color: #fdfbf7;
        }
        .photo-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            display: none;
        }
        
        /* 스캐닝 애니메이션 (금가루가 뿌려지는 듯한 느낌) */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #b48e4b;
            box-shadow: 0 0 15px #b48e4b, 0 0 5px #b48e4b;
            top: 0;
            left: 0;
            z-index: 20;
            opacity: 0;
        }
        
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { top: 100%; opacity: 0; }
        }
        .scanning .scan-line {
            animation: scan 2s linear infinite;
        }
        .scanning .photo-preview {
            filter: contrast(1.1) brightness(1.05) sepia(0.2);
        }

        /* 세로쓰기 포인트 텍스트용 */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-hanji-light shadow-2xl relative overflow-hidden trad-border p-6 md:p-12 my-8">
        
        <!-- 장식용 모서리 문양 (가상) -->
        <div class="absolute top-4 left-4 w-6 h-6 border-t-2 border-l-2 border-wood"></div>
        <div class="absolute top-4 right-4 w-6 h-6 border-t-2 border-r-2 border-wood"></div>
        <div class="absolute bottom-4 left-4 w-6 h-6 border-b-2 border-l-2 border-wood"></div>
        <div class="absolute bottom-4 right-4 w-6 h-6 border-b-2 border-r-2 border-wood"></div>

        <div class="text-center mb-12 mt-4 relative">
            <!-- 붉은 도장 느낌의 장식 -->
            <div class="absolute top-0 right-1/4 transform translate-x-10 -translate-y-4 w-12 h-12 border-2 border-stamp text-stamp flex items-center justify-center rounded-sm opacity-80 rotate-12">
                <span class="text-sm font-black leading-none">天生<br>緣分</span>
            </div>
            
            <h1 class="text-3xl md:text-5xl font-black text-wood-dark mb-4 tracking-widest">
                AI <span class="text-4xl md:text-6xl text-stamp">觀相</span> 궁합 분석
            </h1>
            <p class="text-ink-light text-sm md:text-base tracking-wider">음양오행(陰陽五行)의 이치와 현대 AI 기술을 접목하여 두 사람의 연을 들여다봅니다.</p>
        </div>

        <div class="flex flex-col md:flex-row gap-8 mb-10 justify-center items-center">
            
            <!-- 사람 1 업로드 -->
            <div class="flex flex-col items-center w-full md:w-2/5">
                <div class="flex items-center gap-2 mb-3">
                    <span class="w-2 h-2 bg-wood rounded-full"></span>
                    <h3 class="text-lg font-bold text-wood">첫 번째 인연 (甲)</h3>
                    <span class="w-2 h-2 bg-wood rounded-full"></span>
                </div>
                <label for="upload-1" class="photo-upload w-56 h-72 border border-wood-light bg-hanji flex flex-col items-center justify-center cursor-pointer group p-2 shadow-inner">
                    <div class="w-full h-full border border-dashed border-wood/40 flex flex-col items-center justify-center relative">
                        <svg class="w-12 h-12 text-wood/50 group-hover:text-stamp transition-colors mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <span class="text-sm text-ink-light group-hover:text-ink font-semibold">정면 사진을 모셔오기</span>
                        <img id="preview-1" class="photo-preview" src="" alt="Preview 1">
                        <div class="scan-line"></div>
                    </div>
                </label>
                <input type="file" id="upload-1" accept="image/*" class="hidden" onchange="previewImage(event, 'preview-1')">
            </div>

            <!-- 중앙 장식 -->
            <div class="hidden md:flex flex-col items-center justify-center w-1/5">
                <div class="h-16 w-px bg-wood-light mb-4"></div>
                <div class="text-3xl text-stamp font-black border border-stamp rounded-full p-3 bg-stamp/5">合</div>
                <div class="h-16 w-px bg-wood-light mt-4"></div>
            </div>

            <!-- 사람 2 업로드 -->
            <div class="flex flex-col items-center w-full md:w-2/5">
                <div class="flex items-center gap-2 mb-3">
                    <span class="w-2 h-2 bg-wood rounded-full"></span>
                    <h3 class="text-lg font-bold text-wood">두 번째 인연 (乙)</h3>
                    <span class="w-2 h-2 bg-wood rounded-full"></span>
                </div>
                <label for="upload-2" class="photo-upload w-56 h-72 border border-wood-light bg-hanji flex flex-col items-center justify-center cursor-pointer group p-2 shadow-inner">
                    <div class="w-full h-full border border-dashed border-wood/40 flex flex-col items-center justify-center relative">
                        <svg class="w-12 h-12 text-wood/50 group-hover:text-stamp transition-colors mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <span class="text-sm text-ink-light group-hover:text-ink font-semibold">정면 사진을 모셔오기</span>
                        <img id="preview-2" class="photo-preview" src="" alt="Preview 2">
                        <div class="scan-line"></div>
                    </div>
                </label>
                <input type="file" id="upload-2" accept="image/*" class="hidden" onchange="previewImage(event, 'preview-2')">
            </div>
        </div>

        <p id="error-msg" class="text-stamp text-center text-sm font-bold mb-6 h-5 opacity-0 transition-opacity">두 분의 용안(사진)을 모두 모셔주십시오.</p>

        <div class="flex justify-center mb-10">
            <button id="analyze-btn" onclick="startAnalysis()" class="px-10 py-4 bg-wood hover:bg-wood-dark text-hanji-light font-bold text-lg tracking-widest border-2 border-wood-dark shadow-lg transform transition hover:-translate-y-1 active:translate-y-0 flex items-center gap-3 relative overflow-hidden group">
                <span class="absolute w-0 h-0 transition-all duration-500 ease-out bg-stamp rounded-full group-hover:w-56 group-hover:h-56 opacity-10"></span>
                <span class="relative">궁합(宮合) 풀이 시작</span>
            </button>
        </div>

        <!-- 분석 중 로딩 바 -->
        <div id="loading-area" class="hidden flex-col items-center justify-center py-8">
            <div class="w-full max-w-md border border-wood bg-hanji h-3 mb-4 overflow-hidden relative">
                <div id="progress-bar" class="bg-wood-dark h-full w-0 transition-all duration-300 ease-out"></div>
            </div>
            <p id="loading-text" class="text-wood-dark font-bold tracking-widest animate-pulse">천지인(天地人)의 기운을 살피는 중...</p>
        </div>

        <div id="result-area" class="hidden mt-8 pt-10 border-t-2 border-wood/30 animate-[fadeIn_1s_ease-out]">
            
            <!-- 점수 및 요약 -->
            <div class="text-center mb-12">
                <p class="text-ink-light font-bold mb-4 tracking-widest border-b border-wood-light inline-block pb-1">AI 종합 관상 궁합 지수</p>
                <div class="flex justify-center items-end gap-3 text-wood-dark mb-4">
                    <span id="score-result" class="text-6xl md:text-8xl font-black tabular-nums tracking-tighter">0</span>
                    <span class="text-3xl md:text-4xl pb-2 font-bold">점</span>
                </div>
                <div class="inline-block bg-stamp text-hanji-light px-6 py-2 text-2xl font-black tracking-widest shadow-md">
                    <span id="score-title">천생연분</span>
                </div>
            </div>

            <!-- 상세 분석 결과 그리드 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 bg-hanji p-6 border border-wood-light shadow-inner">
                
                <!-- 1. 얼굴형과 조화 -->
                <div class="border-t border-wood-light pt-4">
                    <h4 class="font-black text-lg text-wood mb-2 flex items-center gap-2">
                        <span class="text-stamp">▪</span> 얼굴형과 음양오행
                    </h4>
                    <p id="result-shape" class="text-ink text-sm md:text-base leading-loose text-justify break-keep"></p>
                </div>

                <!-- 2. 눈매 (안상) -->
                <div class="border-t border-wood-light pt-4">
                    <h4 class="font-black text-lg text-wood mb-2 flex items-center gap-2">
                        <span class="text-stamp">▪</span> 안상(眼相) - 눈과 전택궁
                    </h4>
                    <p id="result-eyes" class="text-ink text-sm md:text-base leading-loose text-justify break-keep"></p>
                </div>
                
                <!-- 3. 코 (재백궁) -->
                <div class="border-t border-wood-light pt-4">
                    <h4 class="font-black text-lg text-wood mb-2 flex items-center gap-2">
                        <span class="text-stamp">▪</span> 재백궁(財帛宮) - 코와 재물운
                    </h4>
                    <p id="result-nose" class="text-ink text-sm md:text-base leading-loose text-justify break-keep"></p>
                </div>

                <!-- 4. 입과 턱 (구상/노복궁) -->
                <div class="border-t border-wood-light pt-4">
                    <h4 class="font-black text-lg text-wood mb-2 flex items-center gap-2">
                        <span class="text-stamp">▪</span> 하정(下停) - 입과 말년운
                    </h4>
                    <p id="result-mouth" class="text-ink text-sm md:text-base leading-loose text-justify break-keep"></p>
                </div>

                <!-- 종합 평 -->
                <div class="border-t-2 border-wood pt-6 md:col-span-2 mt-4 relative">
                    <div class="absolute -top-4 left-1/2 transform -translate-x-1/2 bg-hanji px-4 text-stamp font-black text-lg">
                        총평 (總評)
                    </div>
                    <p id="result-summary" class="text-ink-light font-bold text-base md:text-lg leading-loose text-center mt-2 p-4 bg-wood/5 border border-wood/10"></p>
                </div>
            </div>

            <div class="flex justify-center mt-12">
                <button onclick="resetApp()" class="text-wood hover:text-stamp font-bold transition flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    새로운 인연 알아보기
                </button>
            </div>
        </div>
    </div>

    <script>
        let img1Uploaded = false;
        let img2Uploaded = false;

        function previewImage(event, previewId) {
            const input = event.target;
            const preview = document.getElementById(previewId);

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    
                    if(previewId === 'preview-1') img1Uploaded = true;
                    if(previewId === 'preview-2') img2Uploaded = true;
                    
                    document.getElementById('error-msg').style.opacity = '0';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 1. 얼굴형 (음양오행)
        const shapeTexts = [
            "두 분의 안면 윤곽은 목(木)형과 수(水)형의 기운이 만나, 물이 나무를 키워주듯 상호 발전을 이끄는 상입니다. 한 사람의 둥근 턱선과 다른 사람의 뚜렷한 골격이 서로의 모자란 부분을 채워줍니다.",
            "얼굴의 상정, 중정, 하정의 삼정(三停) 비율이 두 분 모두 균형 잡혀 있습니다. 특히 이마(관록궁)의 뻗어감이 비슷하여, 같은 목표를 향해 나아갈 때 큰 흔들림 없이 가업이나 뜻을 이룰 수 있는 길상입니다.",
            "한 분은 금(金)의 단단함을, 다른 한 분은 토(土)의 포용력을 지닌 얼굴형입니다. 성향 차이는 있을 수 있으나 토생금(土生金)의 이치로 서로에게 든든한 흙과 바위가 되어주는 안정적인 관계입니다."
        ];

        // 2. 눈매 (안상)
        const eyeTexts = [
            "한 분은 눈매가 길고 수려한 봉황안(鳳凰眼)의 기운이 있고, 다른 한 분은 눈빛이 깊고 단단하여 흑백이 분명합니다. 두 분이 마주 볼 때 서로의 지혜와 통찰력이 얽혀 소통에 오해가 적고 깊은 신뢰를 쌓게 됩니다.",
            "눈썹과 눈 사이인 전택궁(田宅宮)이 두 분 모두 맑고 넓습니다. 이는 두 사람이 함께 가정을 꾸렸을 때 부동산이나 거주지의 복이 크게 따르며, 눈꼬리(어미)의 주름이 서로를 향해 웃는 상이라 화목함이 끊이지 않습니다.",
            "눈동자의 정기(精氣)가 서로 비슷한 주파수를 띠고 있습니다. 한 분의 눈빛이 부드럽게 감싸면 다른 한 분의 눈매가 생기를 더해주는 음양의 조화가 뛰어나, 곁에 있는 것만으로도 마음이 평안해집니다."
        ];

        // 3. 코 (재백궁)
        const noseTexts = [
            "코끝인 준두(準頭)가 둥글고 힘이 있으며, 콧방울(난대/정위)이 도톰하여 두 분 모두 재물운이 넉넉합니다. 재백궁의 기운이 서로 부딪히지 않고 모이는 형국이라 함께 재산을 불려 나가기에 최적의 궁합입니다.",
            "한 분은 코대가 곧고 높게 뻗어 결단력이 있으며, 다른 한 분은 코끝이 부드러워 융통성을 발휘합니다. 강직함과 부드러움이 만나니 경제적인 결정을 내릴 때 실패가 적고 가산이 흩어지지 않는 길복의 상입니다.",
            "두 분의 콧대 라인이 서로 평행선을 이루듯 조화롭습니다. 이는 인생의 굴곡을 함께 넘을 때 금전적인 풍파가 닥쳐도 서로의 기운으로 방어해 내는 튼튼한 금고를 가진 것과 같습니다."
        ];

        // 4. 입과 턱 (구상/노복궁)
        const mouthTexts = [
            "입술의 두께가 서로를 보완합니다. 한 분은 윗입술이 두터워 베푸는 정이 많고, 한 분은 아랫입술이 도톰하여 받는 복이 큽니다. 말년운을 뜻하는 지각(턱)이 둥글고 넓어 노년이 될수록 애정이 깊어집니다.",
            "두 분 모두 입꼬리(구각)가 자연스럽게 위를 향하는 앙월구(仰月口)의 형태를 지녔습니다. 긍정적인 에너지를 서로 주고받으며, 턱뼈(시골)의 발달 정도가 조화로워 주변에 사람과 아랫사람(노복궁)의 덕이 따릅니다.",
            "입의 크기와 형태에서 한 사람은 수용적이고 한 사람은 표현력이 뛰어난 상입니다. 대화가 단절되지 않고 서로의 감정을 잘 헤아리며, 턱선이 부드럽게 맞물려 인생의 황혼기까지 평탄하고 다복하게 살아갑니다."
        ];

        // 5. 총평
        const summaryTexts = [
            "음양오행의 이치가 시곗바늘처럼 정확하게 맞물려 돌아가는 '천생연분(天生緣分)'의 상입니다. 각자의 모자란 기운을 상대방이 넘치도록 채워주며, 백 년을 해로해도 질리지 않을 깊고 단단한 인연이니 이 연을 굳게 잡으십시오.",
            "서로 다르게 생긴 듯하지만, 관상학적 기운의 파동은 완벽한 화음(和音)을 이루고 있습니다. 가끔 부딪히는 일이 있더라도 그것이 오히려 서로를 연단하는 과정이 되어, 시간이 흐를수록 더욱 거대한 복을 불러오는 '찰떡궁합'입니다.",
            "얼굴의 삼정(상정, 중정, 하정)과 오악(이마, 코, 턱, 양광대)이 서로 기운을 북돋아 주는 '상호보완'의 훌륭한 상입니다. 재물과 명예, 그리고 가정의 평화가 두 분이 맞잡은 손을 통해 피어나니 서로를 귀인(貴人)으로 여기며 아끼십시오."
        ];

        function startAnalysis() {
            if (!img1Uploaded || !img2Uploaded) {
                document.getElementById('error-msg').style.opacity = '1';
                return;
            }

            document.getElementById('analyze-btn').classList.add('hidden');
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('loading-area').classList.remove('hidden');
            document.getElementById('loading-area').classList.add('flex');

            document.querySelectorAll('.photo-upload').forEach(el => el.classList.add('scanning'));

            const progressBar = document.getElementById('progress-bar');
            const loadingText = document.getElementById('loading-text');
            
            let progress = 0;
            const messages = [
                "오행(五行)의 기운을 살피는 중...", 
                "삼정(三停)의 비율을 재고 있습니다...", 
                "전택궁과 재백궁의 길흉을 판별 중...", 
                "두 인연의 음양(陰陽) 교차점 찾는 중...",
                "관상학적 총합 운세 기록 중..."
            ];

            const interval = setInterval(() => {
                progress += Math.random() * 12;
                if (progress > 100) progress = 100;
                
                progressBar.style.width = `${progress}%`;
                
                const msgIndex = Math.floor((progress / 100) * messages.length);
                if(msgIndex < messages.length) {
                    loadingText.innerText = messages[msgIndex];
                }

                if (progress === 100) {
                    clearInterval(interval);
                    setTimeout(showResults, 1000);
                }
            }, 400);
        }

        function showResults() {
            document.getElementById('loading-area').classList.remove('flex');
            document.getElementById('loading-area').classList.add('hidden');
            document.querySelectorAll('.photo-upload').forEach(el => el.classList.remove('scanning'));

            // 랜덤 점수 (80 ~ 99)
            const score = Math.floor(Math.random() * (99 - 80 + 1)) + 80;
            
            // 상세 텍스트 무작위 선택
            const shapeText = shapeTexts[Math.floor(Math.random() * shapeTexts.length)];
            const eyeText = eyeTexts[Math.floor(Math.random() * eyeTexts.length)];
            const noseText = noseTexts[Math.floor(Math.random() * noseTexts.length)];
            const mouthText = mouthTexts[Math.floor(Math.random() * mouthTexts.length)];
            const summaryText = summaryTexts[Math.floor(Math.random() * summaryTexts.length)];
            
            let title = "";
            if(score >= 95) title = "천생연분(天生緣分)";
            else if(score >= 90) title = "백년해로(百年偕老)";
            else if(score >= 85) title = "금상첨화(錦上添花)";
            else title = "상호보완(相互補完)";

            // DOM 업데이트
            document.getElementById('result-shape').innerText = shapeText;
            document.getElementById('result-eyes').innerText = eyeText;
            document.getElementById('result-nose').innerText = noseText;
            document.getElementById('result-mouth').innerText = mouthText;
            document.getElementById('result-summary').innerText = summaryText;
            document.getElementById('score-title').innerText = title;

            document.getElementById('result-area').classList.remove('hidden');

            animateScore(score);
        }

        function animateScore(targetScore) {
            let current = 0;
            const scoreElement = document.getElementById('score-result');
            const step = targetScore / 40;

            const timer = setInterval(() => {
                current += step;
                if (current >= targetScore) {
                    current = targetScore;
                    clearInterval(timer);
                    scoreElement.classList.add('scale-110', 'text-stamp');
                    setTimeout(() => scoreElement.classList.remove('scale-110'), 400);
                }
                scoreElement.innerText = Math.floor(current);
            }, 30);
        }

        function resetApp() {
            img1Uploaded = false;
            img2Uploaded = false;

            document.getElementById('upload-1').value = '';
            document.getElementById('upload-2').value = '';
            document.getElementById('preview-1').style.display = 'none';
            document.getElementById('preview-2').style.display = 'none';
            document.getElementById('preview-1').src = '';
            document.getElementById('preview-2').src = '';
            
            document.getElementById('result-area').classList.add('hidden');
            document.getElementById('analyze-btn').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('score-result').innerText = '0';
            document.getElementById('score-result').classList.remove('text-stamp');
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
